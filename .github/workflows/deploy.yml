name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 22ac36d0db90024b8a20076027700ad7
          command: pages deploy dist --project-name=task

      - name: Verify production API
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Deployment URL: $URL"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/add-component" -H 'Content-Type: application/json' -d '{"command":"@evil/x"}')
          echo "Invalid command -> HTTP $CODE (expect 400)"
          [ "$CODE" = "400" ]
