name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_FIaWHFDNvNcG1ZR62KYthk7h
          VERCEL_PROJECT_ID: prj_goQxCFq8Lw8469yFzHqOFmgEzBuF
        run: npx vercel --prod --yes --token="$VERCEL_TOKEN" | tee deploy_out.txt

      - name: Verify production API
        run: |
          URL="$(grep -oP 'https://[^ ]+\.vercel\.app' deploy_out.txt | head -1)"
          echo "Production URL: $URL"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/add-component" -H 'Content-Type: application/json' -d '{"command":"@evil/x"}')
          echo "Invalid command -> HTTP $CODE (expect 400)"
          [ "$CODE" = "400" ]
