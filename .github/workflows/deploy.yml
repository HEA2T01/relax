name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_FIaWHFDNvNcG1ZR62KYthk7h
          VERCEL_PROJECT_ID: prj_goQxCFq8Lw8469yFzHqOFmgEzBuF
        run: npx vercel --prod --yes --token="$VERCEL_TOKEN"
